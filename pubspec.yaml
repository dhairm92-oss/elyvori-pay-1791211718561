name: elyvori_pay
description: محفظة Elyvori Pay الإلكترونية - أرسل واستقبل الأموال بالشيكل والدولار والدينار
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  hive_ce: ^2.6.0
  hive_ce_flutter: ^2.1.0
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.2
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  equatable: ^2.0.7
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  mobile_scanner: ^6.0.10
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

# App icon: drawn by tool/make_icon.py in CI, then `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#05060A"
    theme_color: "#05060A"
